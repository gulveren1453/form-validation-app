name: Run Jest Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v3

      - name: 🟢 Node.js ortamını ayarla
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Bağımlılıkları yükle
        run: npm install

      - name: 🧪 Testleri çalıştır
        run: npm test
